name: Build iOS (Simulator)

# Builds the iOS app for the Simulator, boots an iPhone, installs it, and
# captures screenshots — so the app can be seen running in a real iOS
# environment without a Mac and without an Apple Developer account.
#
# Simulator builds need no code signing, which is why this works for $0. What it
# CANNOT cover: push notifications (APNs needs a real device), StoreKit / in-app
# purchase, and native Google Sign-In (needs an iOS OAuth client). Those require
# the paid Apple Developer Program and a physical device.
#
# Run it: Actions tab → "Build iOS (Simulator)" → Run workflow.
# Then download the "ios-simulator-screenshots" artifact.
#
# NOTE: macOS runners bill at 10x the rate of Linux ones, so this is manual-only
# on purpose — no push trigger.

on:
  workflow_dispatch:
    inputs:
      device:
        description: Simulator device (leave empty to auto-pick the newest iPhone)
        default: ""
        required: false

permissions:
  contents: write   # needed to publish the simulator build to a Release

jobs:
  simulator:
    name: Build and boot on Simulator
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The app loads its UI from server.url (see capacitor.config.ts), so the
      # bundled webDir is only a placeholder. Capacitor still requires the
      # directory to exist before `cap sync`.
      - name: Stage placeholder web assets
        run: |
          mkdir -p out
          [ -f out/index.html ] || echo '<!doctype html><title>TradeX</title>' > out/index.html

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      # No device is hardcoded. Runner images swap their simulator set with every
      # Xcode bump (the iPhone 16 Pro this originally named was already gone),
      # so the newest available iPhone is picked at run time instead.
      #
      # Every grep here is guarded: GitHub runs `bash -e`, and a grep that
      # matches nothing exits 1, which kills the step before any fallback below
      # it can run.
      - name: Boot simulator
        id: sim
        run: |
          LIST=$(xcrun simctl list devices available)
          echo "Available iPhone simulators on this runner:"
          echo "$LIST" | grep -E 'iPhone' || true

          DEVICE="${{ github.event.inputs.device }}"
          UDID=""
          if [ -n "$DEVICE" ]; then
            UDID=$(echo "$LIST" | grep -m1 -F "$DEVICE (" | grep -oE '[0-9A-F-]{36}' || true)
            [ -z "$UDID" ] && echo "::warning::'$DEVICE' is not on this runner  -  picking automatically"
          fi

          # Prefer a Pro, then any iPhone at all.
          if [ -z "$UDID" ]; then
            UDID=$(echo "$LIST" | grep -m1 -E '^[[:space:]]*iPhone [0-9]+ Pro \(' \
              | grep -oE '[0-9A-F-]{36}' || true)
          fi
          if [ -z "$UDID" ]; then
            UDID=$(echo "$LIST" | grep -m1 -E '^[[:space:]]*iPhone ' \
              | grep -oE '[0-9A-F-]{36}' || true)
          fi
          if [ -z "$UDID" ]; then
            echo "::error::No iPhone simulator available on this runner"
            exit 1
          fi

          NAME=$(echo "$LIST" | grep -m1 "$UDID" | sed -E 's/^[[:space:]]*([^(]*) \(.*/\1/')
          echo "Booting: $NAME ($UDID)"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b

      - name: Build for simulator
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Install and launch
        run: |
          APP=$(find build/Build/Products/Debug-iphonesimulator -maxdepth 1 -name '*.app' | head -1)
          echo "Installing $APP"
          xcrun simctl install "${{ steps.sim.outputs.udid }}" "$APP"
          xcrun simctl launch "${{ steps.sim.outputs.udid }}" online.tradexterminal.app

      # The UI is fetched over the network on launch, so give it time to paint
      # before each capture rather than shooting a blank WKWebView.
      - name: Capture screenshots
        run: |
          mkdir -p screenshots
          for i in 1 2 3; do
            sleep 12
            xcrun simctl io "${{ steps.sim.outputs.udid }}" screenshot "screenshots/launch-$i.png"
          done

      - name: Collect simulator log
        if: always()
        run: |
          xcrun simctl spawn "${{ steps.sim.outputs.udid }}" log show \
            --last 5m --predicate 'process == "App"' > screenshots/app.log 2>&1 || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-simulator-screenshots
          path: screenshots/
          retention-days: 14

      # Appetize needs a zip with App.app at its root. `ditto --keepParent` does
      # exactly that; --sequesterRsrc is left off so no __MACOSX sibling lands
      # next to the bundle.
      - name: Package the .app
        if: success()
        run: |
          APP=$(find build/Build/Products/Debug-iphonesimulator -maxdepth 1 -name '*.app' | head -1)
          ditto -c -k --keepParent "$APP" TradeX-simulator.zip
          echo "Zip contents (App.app must be at the root):"
          unzip -l TradeX-simulator.zip | head -5

      # Published as a Release asset, not just an artifact: an artifact download
      # arrives wrapped in a SECOND zip, so uploading it straight to Appetize
      # fails with "No .app folder found". A Release asset downloads as the raw
      # file, ready to upload as-is.
      - name: Publish to a Release (ready for Appetize)
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ios-simulator
          name: iOS Simulator build
          body: |
            Interactive testing without a Mac:

            1. Download TradeX-simulator.zip below  -  do NOT unzip it.
            2. Go to appetize.io -> Apps -> Upload App.
            3. Pick the zip as downloaded.

            Sign in with email and password. Google Sign-In and in-app purchase
            do not work on a simulator  -  both need a paid Apple Developer
            account and a real device.
          files: TradeX-simulator.zip

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ios-simulator-app
          path: TradeX-simulator.zip
          retention-days: 14
